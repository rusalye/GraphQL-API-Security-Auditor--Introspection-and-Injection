version: "3.9"

services:
  # MongoDB — Persistent database
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: graphql_api
    volumes:
      - mongo_data:/data/db
    networks:
      - graphql-net
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Vulnerable Target API — runs on port 4000
  target-api:
    build:
      context: ./target_api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - graphql-net
    restart: unless-stopped

  # Security Middleware — runs on port 8080
  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - TARGET_GRAPHQL_URL=http://target-api:4000/graphql
      - JWT_SECRET_KEY=your-secret-key-change-in-production
    depends_on:
      - target-api
    networks:
      - graphql-net
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  graphql-net:
    driver: bridge
